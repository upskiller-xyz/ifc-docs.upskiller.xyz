# Quality gates for the docs site. Deployment lives in deploy-scaleway.yml —
# this workflow only checks, it never ships.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build needs the private fonts HERE too, not only in the deploy.
      # Docusaurus resolves the root-relative url() in src/css/fonts.css
      # against static/ as a webpack module, so an absent font is not a 404 at
      # runtime — it is "Can't resolve '/fonts/…'" and the bundle never
      # compiles. Without this step every CI run and pull request is red.
      - name: Fetch private build-time assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
          AWS_DEFAULT_REGION: fr-par
        run: bash scripts/fetch-assets.sh --require --force

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      # The real link check: onBrokenLinks is 'throw', so a dead internal link
      # or a sidebar id with no file fails here.
      - name: Build site
        run: npm run build
